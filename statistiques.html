<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StatObs Élèves – Bilan</title>
<meta name="theme-color" content="#FFC800">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StatObs">
<link rel="stylesheet" href="statobs.css">
</head>
<body>
<div class="container wide">
  <div class="brand" style="margin-bottom:0"><img src="icons/icon-192.png" alt="" style="width:44px;height:44px;border-radius:11px"><h1 style="font-size:1.4rem">StatObs</h1></div>
  <h2 class="page-title">Statistiques et bilan du sportif</h2>

  <p class="who"><b id="playerName">-</b> <span class="muted">observé par</span> <b id="observerName">-</b></p>
  <p class="muted" style="text-align:center" id="meta"></p>

  <div class="legend"><span><i class="p"></i>Observable positif</span><span><i class="n"></i>Observable négatif</span></div>
  <div class="radar-wrap" id="chart"></div>

  <h2 class="section-title">Synthèse des observables</h2>
  <div class="table-wrap">
    <table class="st">
      <thead><tr><th>Observable</th><th class="c">Type</th><th class="c">Nb</th><th class="c">%</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2 class="section-title">Bilan et objectifs</h2>
  <div id="bilan"></div>

  <div class="msg warn" id="saveMsg">Pensez à enregistrer le fichier de résultats et à le remettre à votre enseignant.</div>

  <div class="btn-row">
    <button class="btn btn-dark" id="exportBtn">💾 Enregistrer le fichier (.xlsx)</button>
    <button class="btn btn-ghost" id="printBtn">Imprimer / PDF</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="swapBtn">🔄 Inverser les rôles</button>
    <button class="btn btn-primary" id="newBtn">Nouvelle observation</button>
  </div>
</div>

<script src="eps-xlsx.js"></script>
<script src="statobs-bilan.js"></script>
<script src="statobs.js"></script>
<script>
(function () {
  'use strict';
  const S = StatObs, K = S.K, E = S.esc, B = StatObsBilan;
  const $ = id => document.getElementById(id);
  const f = S.read(K.final);
  if (!f) { location.replace('index.html'); return; }
  const p = f.joueurs[0], o = f.observateurs[0];

  $('playerName').textContent = S.label(p);
  $('observerName').textContent = S.label(o);
  $('meta').textContent = `${f.activite} · ${new Date(f.id).toLocaleDateString('fr-FR')} · durée ${f.duration}`;

  const acts = B.actsOf(f, p.id), total = acts.reduce((s, a) => s + a.count, 0);
  $('chart').innerHTML = `<h3>Analyse des ${total} action${total > 1 ? 's' : ''} observée${total > 1 ? 's' : ''}</h3>` + B.radar(acts);
  const sorted = [...acts].sort((a, d) => a.polarity !== d.polarity ? (a.polarity === 'positive' ? -1 : 1) : d.count - a.count);
  $('rows').innerHTML = sorted.map(a => {
    const neg = a.polarity === 'negative';
    return `<tr><td>${E(a.label)}</td><td class="c"><span class="tag ${neg ? 'n' : 'p'}">${neg ? '– Négatif' : '+ Positif'}</span></td>` +
      `<td class="c"><b>${a.count}</b></td><td class="c">${total ? (a.count / total * 100).toFixed(1) : '0.0'} %</td></tr>`;
  }).join('');
  $('bilan').innerHTML = B.toHTML(B.coach({ nom: p.nom, activite: f.activite, acts, ms: B.msOf(f) }));

  const isSaved = () => localStorage.getItem(S.SAVED) === String(f.id);
  const showSaved = () => { if (isSaved()) { $('saveMsg').className = 'msg ok'; $('saveMsg').textContent = `✓ Fichier « ${S.fileName(f)} » enregistré. Remettez-le à votre enseignant.`; } };
  showSaved();

  $('exportBtn').addEventListener('click', () =>
    S.exportXlsx(f).then(showSaved).catch(e => S.toast('Enregistrement impossible : ' + (e && e.message || e))));
  $('printBtn').addEventListener('click', () => window.print());

  const leave = (prefill) => {
    if (!isSaved() && !confirm('Le fichier de résultats n\'a pas été enregistré. Continuer quand même ?')) return;
    if (prefill) S.write(S.PREFILL, prefill);
    S.clearSession(); location.href = 'index.html';
  };
  $('swapBtn').addEventListener('click', () => leave({ o: p, e: o, activite: f.activite, items: f.items, polarity: f.polarity }));
  $('newBtn').addEventListener('click', () => leave({ o, e: { n: '', p: '', classe: o.classe }, activite: f.activite, items: f.items, polarity: f.polarity }));
})();
</script>
</body>
</html>
